<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BloxyMart</title>
  <style>
    /* simplified styles for clarity */
    body{font-family:Arial,Helvetica,sans-serif;background:#071029;color:#e6eef8;margin:0}
    .wrap{max-width:980px;margin:24px auto;padding:18px}
    .card{background:#071a2b;border-radius:12px;padding:14px}
    .top{display:flex;gap:8px}
    input{flex:1;padding:10px;border-radius:8px;border:1px solid #123}
    button,a{padding:10px 12px;border-radius:8px;border:0;cursor:pointer}
    .btn-primary{background:#5eead4;color:#042825}
    .btn-success{background:#34d399;color:#044231}
    .panel{display:flex;gap:12px;align-items:flex-start}
    img{width:160px;height:160px;border-radius:8px;object-fit:cover}
    pre{background:#021224;padding:10px;border-radius:8px;color:#cfe3ff;overflow:auto}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <input id="username" placeholder="Username de Roblox" />
        <button id="btnSearch" class="btn-primary">Buscar</button>
        <button id="btnClear">Limpiar</button>
      </div>
      <hr />
      <div class="panel">
        <div>
          <img id="avatarPreview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 160'><rect width='160' height='160' fill='%23010f1a'/><text x='50%' y='50%' fill='%239fb1d1' font-size='12' text-anchor='middle' dominant-baseline='middle'>Sin preview</text></svg>" alt="preview">
          <div style="margin-top:8px">
            <a id="downloadR15" class="btn-success" href="#">⬇️ R15 OBJ</a>
            <a id="downloadR6" class="btn-success" href="#">⬇️ R6 OBJ</a>
          </div>
        </div>
        <div style="flex:1">
          <div id="meta">Usuario: — / Display: — / ID: —</div>
          <h4>Artículos</h4>
          <div id="wearing">—</div>
          <h4>Respuesta cruda</h4>
          <pre id="raw">—</pre>
        </div>
      </div>
    </div>
  </div>
<script>
const usernameEl = document.getElementById('username');
const btnSearch = document.getElementById('btnSearch');
const btnClear = document.getElementById('btnClear');
const avatarPreview = document.getElementById('avatarPreview');
const meta = document.getElementById('meta');
const rawEl = document.getElementById('raw');
const wearingEl = document.getElementById('wearing');
const downloadR15 = document.getElementById('downloadR15');
const downloadR6 = document.getElementById('downloadR6');

let currentUserId = null;

function setStatus(msg, isError){
  meta.textContent = msg;
  if(isError) meta.style.color = '#f88'; else meta.style.color = '#cfe3ff';
}

async function safeJson(res){
  const ct = res.headers.get('content-type') || '';
  if(ct.includes('application/json')) return res.json();
  // try json, fallback to text
  try{ return await res.json(); }catch(e){ const text = await res.text(); return { error: text }; }
}

async function search(){
  const username = usernameEl.value.trim(); if(!username){ setStatus('Escribe un username', true); return }
  btnSearch.disabled = true; setStatus('Buscando...');
  try{
    const res = await fetch('/api/search', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ username }) });
    const data = await safeJson(res);
    if(!res.ok) throw new Error(data.error || data || 'Error buscando');
    const { user, profile, avatarUrl, assets } = data;
    currentUserId = user.id;
    avatarPreview.src = avatarUrl || avatarPreview.src;
    meta.innerHTML = `Usuario: ${profile.name} / Display: ${profile.displayName || '—'} / ID: ${user.id}`;
    wearingEl.innerHTML = assets && assets.length ? assets.map(a=> `<div>${a.name} (${a.assetType}) #${a.id}</div>`).join('') : 'Sin artículos';
    rawEl.textContent = JSON.stringify(data, null, 2);
    downloadR15.onclick = ()=> downloadModel(user.id,'r15');
    downloadR6.onclick = ()=> downloadModel(user.id,'r6');
  }catch(err){ setStatus('Error: '+err.message, true); }
  finally{ btnSearch.disabled = false }
}

async function downloadModel(userId, type){
  if(!userId){ setStatus('No user selected', true); return }
  try{
    setStatus('Descargando ZIP...');
    const res = await fetch('/api/download', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ userId, type }) });
    if(!res.ok){ const data = await safeJson(res); throw new Error(data.error || 'Descarga fallida'); }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `avatar_${userId}_${type}.zip`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    setStatus('Descarga completada');
  }catch(err){ setStatus('Error: '+err.message, true); }
}

btnSearch.addEventListener('click', search);
btnClear.addEventListener('click', ()=>{ usernameEl.value=''; avatarPreview.src='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160"><rect width="160" height="160" fill="%23010f1a"/><text x="50%" y="50%" fill="%239fb1d1" font-size="12" text-anchor="middle" dominant-baseline="middle">Sin preview</text></svg>'; meta.textContent='Usuario: — / Display: — / ID: —'; wearingEl.innerHTML='—'; rawEl.textContent='—'; currentUserId=null })

</script>
</body>
</html>
