<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BloxyMart - Roblox Avatar Downloader</title>
  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#0b1220;
      color:#fff;
    }
    .wrap{
      max-width:1000px;
      margin:0 auto;
      padding:24px;
    }
    .card{
      background:#111b2e;
      border:1px solid #22304d;
      border-radius:16px;
      overflow:hidden;
    }
    .top{
      padding:16px;
      border-bottom:1px solid #22304d;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    input, button, a{
      font-size:16px;
      border-radius:12px;
    }
    input{
      flex:1;
      min-width:240px;
      padding:12px 14px;
      border:1px solid #2b3a5b;
      background:#0f172a;
      color:#fff;
      outline:none;
    }
    button, a.btn{
      padding:12px 16px;
      border:0;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }
    .btn-primary{ background:#5eead4; color:#07201c; font-weight:700; }
    .btn-secondary{ background:#60a5fa; color:#fff; font-weight:700; }
    .btn-success{ background:#34d399; color:#065f46; font-weight:700; }
    .content{
      display:grid;
      grid-template-columns:280px 1fr;
      gap:16px;
      padding:16px;
    }
    .panel{
      background:#0f172a;
      border:1px solid #22304d;
      border-radius:14px;
      padding:14px;
    }
    img{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      border-radius:12px;
      background:#08101f;
      border:1px solid #22304d;
    }
    .muted{ color:#9fb1d1; }
    .status{ margin-top:10px; min-height:24px; color:#9fb1d1; }
    .error{ color:#fb7185; }
    .success{ color:#34d399; }
    .chips{ display:flex; flex-wrap:wrap; gap:8px; }
    .chip{
      padding:8px 10px;
      border-radius:999px;
      background:#16233c;
      border:1px solid #2b3a5b;
      color:#cfe3ff;
      font-size:14px;
    }
    pre{
      white-space:pre-wrap;
      word-break:break-word;
      margin:0;
      color:#cbd5e1;
      background:#08101f;
      border:1px solid #22304d;
      border-radius:12px;
      padding:12px;
      max-height:300px;
      overflow-y:auto;
    }
    .download-group {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:12px;
    }
    .asset-list {
      max-height:200px;
      overflow-y:auto;
      border:1px solid #22304d;
      border-radius:8px;
      padding:8px;
    }
    .asset-item {
      padding:8px;
      background:#08101f;
      border-radius:6px;
      margin-bottom:6px;
      border-left:3px solid #5eead4;
      font-size:13px;
    }
    @media (max-width: 760px){
      .content{ grid-template-columns:1fr; }
      .download-group { flex-direction:column; }
      .btn { width:100%; justify-content:center; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🎮 BloxyMart</h1>
    <p class="muted">Descarga avatares de Roblox en R15/R6 como archivos OBJ con texturas.</p>

    <div class="card">
      <div class="top">
        <input id="username" placeholder="Username de Roblox" />
        <button id="btnSearch" class="btn-primary">🔍 Buscar</button>
        <button id="btnClear" class="btn-secondary">🗑️ Limpiar</button>
      </div>

      <div class="content">
        <div class="panel">
          <img id="avatarPreview" alt="Preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 420'><rect width='420' height='420' rx='24' fill='%2308101f'/><text x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' fill='%239fb1d1' font-family='Arial' font-size='20'>Sin preview</text></svg>">
          <div id="meta" class="muted" style="margin-top:12px; line-height:1.6;">
            <div><strong>Usuario:</strong> —</div>
            <div><strong>Display:</strong> —</div>
            <div><strong>User ID:</strong> —</div>
          </div>
          <div class="download-group">
            <a id="downloadR15" class="btn btn-success" href="#" download="avatar.zip">⬇️ R15 OBJ</a>
            <a id="downloadR6" class="btn btn-success" href="#" download="avatar.zip">⬇️ R6 OBJ</a>
          </div>
        </div>

        <div class="panel">
          <h3 style="margin-top:0;">📋 Información</h3>
          <div id="status" class="status">Listo para buscar.</div>

          <h3>👕 Artículos (Ropa & Accesorios)</h3>
          <div id="wearing" class="asset-list">
            <div class="chip">Sin datos</div>
          </div>

          <h3>📦 Datos Completos</h3>
          <pre id="raw">—</pre>
        </div>
      </div>
    </div>
  </div>

<script>
const usernameEl = document.getElementById('username');
const btnSearch = document.getElementById('btnSearch');
const btnClear = document.getElementById('btnClear');
const avatarPreview = document.getElementById('avatarPreview');
const meta = document.getElementById('meta');
const statusEl = document.getElementById('status');
const wearingEl = document.getElementById('wearing');
const rawEl = document.getElementById('raw');
const downloadR15 = document.getElementById('downloadR15');
const downloadR6 = document.getElementById('downloadR6');

let currentUserId = null;

function setStatus(msg, error=false){
  statusEl.textContent = msg;
  statusEl.className = error ? 'status error' : 'status';
}

function escapeHtml(s){
  return String(s)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#39;");
}

async function search(){
  const username = usernameEl.value.trim();
  if(!username){
    setStatus('Escribe un username.', true);
    return;
  }

  btnSearch.disabled = true;
  setStatus('Buscando...');

  try{
    const res = await fetch('/api/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username })
    });

    if(!res.ok) {
      const error = await res.json();
      throw new Error(error.error || 'No encontré ese usuario.');
    }

    const data = await res.json();
    const { user, profile, avatarUrl, assets } = data;
    currentUserId = user.id;

    if(avatarUrl) avatarPreview.src = avatarUrl;

    meta.innerHTML = `
      <div><strong>Usuario:</strong> ${escapeHtml(profile.name || username)}</div>
      <div><strong>Display:</strong> ${escapeHtml(profile.displayName || '—')}</div>
      <div><strong>User ID:</strong> ${escapeHtml(user.id)}</div>
    `;

    // Display assets
    if(assets && assets.length > 0) {
      wearingEl.innerHTML = assets.map(asset => `
        <div class="asset-item">
          <strong>${escapeHtml(asset.name || 'Unknown')}</strong><br>
          <small>ID: ${asset.id} | Tipo: ${asset.assetType}</small>
        </div>
      `).join('');
    } else {
      wearingEl.innerHTML = '<div class="chip">Sin artículos adicionales</div>';
    }

    rawEl.textContent = JSON.stringify({ user, profile, assetCount: assets.length }, null, 2);

    // Setup download buttons
    downloadR15.onclick = () => downloadModel(user.id, 'r15');
    downloadR6.onclick = () => downloadModel(user.id, 'r6');

    setStatus('✅ Avatar encontrado. Listo para descargar.');
  }catch(err){
    setStatus(err.message || 'Falló la búsqueda.', true);
  }finally{
    btnSearch.disabled = false;
  }
}

async function downloadModel(userId, type) {
  try {
    setStatus(`⬇️ Descargando ${type.toUpperCase()}...`);
    
    const res = await fetch('/api/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, type })
    });

    if (!res.ok) {
      const error = await res.json();
      throw new Error(error.error || 'Error en la descarga');
    }

    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `avatar_${userId}_${type}.zip`;
    document.body.appendChild(a);
    a.click();
    window.URL.revokeObjectURL(url);
    document.body.removeChild(a);

    setStatus(`✅ Descarga de ${type.toUpperCase()} completada. Abre con Blender o 3DS Max.`);
  } catch (err) {
    setStatus(`Error: ${err.message}`, true);
  }
}

function clearAll(){
  usernameEl.value = '';
  avatarPreview.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 420'><rect width='420' height='420' rx='24' fill='%2308101f'/><text x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' fill='%239fb1d1' font-family='Arial' font-size='20'>Sin preview</text></svg>";
  meta.innerHTML = `
    <div><strong>Usuario:</strong> —</div>
    <div><strong>Display:</strong> —</div>
    <div><strong>User ID:</strong> —</div>
  `;
  wearingEl.innerHTML = '<div class="chip">Sin datos</div>';
  rawEl.textContent = '—';
  currentUserId = null;
  setStatus('Listo para buscar.');
}

btnSearch.addEventListener('click', search);
btnClear.addEventListener('click', clearAll);
usernameEl.addEventListener('keydown', (e) => {
  if(e.key === 'Enter') search();
});
</script>
</body>
</html>
